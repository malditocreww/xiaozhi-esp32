name: Claudio RLCD-4.2

# Compila solo el firmware de Claudio para la Waveshare ESP32-S3-RLCD-4.2
# (español + sensor mmWave). Se dispara al subir cambios a la rama "claudio"
# o a mano desde la pestaña Actions.

on:
  workflow_dispatch:
  push:
    branches:
      - claudio

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:release-v6.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compilar firmware
        shell: bash
        run: |
          source "$IDF_PATH/export.sh"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python scripts/build.py waveshare/esp32-s3-rlcd-4.2 --name esp32-s3-rlcd-4.2 --language es-ES

      - name: Subir firmware
        uses: actions/upload-artifact@v4
        with:
          name: claudio-rlcd-4.2-${{ github.sha }}
          path: build/merged-binary.bin
          if-no-files-found: error

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: claudio-${{ github.run_number }}
          name: Claudio RLCD-4.2 build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          files: build/merged-binary.bin
          body: |
            Firmware Claudio para Waveshare ESP32-S3-RLCD-4.2 (español + sensor mmWave).
            Grabar con: python -m esptool --chip esp32s3 -p COM4 -b 921600 write-flash 0x0 merged-binary.bin
